<!DOCTYPE html>
<!-- The link-preview image (1200 x 630) shown when a page is shared on
     WhatsApp, Facebook, LinkedIn or X. Not published. To regenerate, open
     http://127.0.0.1:8080/tools/og-card.html (python tools/serve.py) at a
     1200 x 630 viewport, screenshot it, and save it as
     site/assets/img/brand/og-image.jpg. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card</title>
<link rel="stylesheet" href="../site/assets/fonts/fonts.css">
<style>
  :root { --navy: #0B2C53; --navy-deep: #071F3C; --blue: #1B5FA8; --blue-bright: #4A9BE8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--navy-deep); isolation: isolate; }
  .bg { position: absolute; inset: 0; z-index: -1; }
  .bg img { width: 100%; height: 100%; object-fit: cover; }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(97deg, rgba(7,31,60,.97) 0%, rgba(7,31,60,.92) 42%, rgba(9,38,71,.74) 66%, rgba(11,44,83,.6) 100%),
      linear-gradient(to top, rgba(4,20,40,.55), transparent 58%);
  }
  .bg::before {
    content: ''; position: absolute; right: -10%; bottom: -46%; z-index: 1; width: 70%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, rgba(74,155,232,.32), rgba(74,155,232,0) 62%);
  }
  .copy { position: absolute; left: 64px; top: 56px; bottom: 56px; width: 600px; display: flex; flex-direction: column; color: #fff; }
  .mark { display: flex; align-items: center; gap: 14px; }
  .mono { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 12px; background: #fff; color: var(--navy);
          font-family: 'Geist Mono', monospace; font-weight: 500; font-size: 1.2rem; letter-spacing: .02em; }
  .name { font-weight: 600; font-size: 1.45rem; letter-spacing: -.01em; line-height: 1.1; }
  .tag { font-size: .95rem; color: rgba(255,255,255,.7); margin-top: 3px; }
  .eyebrow { margin-top: auto; display: inline-flex; align-items: center; gap: 12px; font-size: .95rem; font-weight: 600;
             letter-spacing: .09em; text-transform: uppercase; color: #BFD9F4; }
  .eyebrow i { width: 10px; height: 10px; border-radius: 2px; background: var(--blue-bright); }
  h1 { margin: 18px 0 0; font-weight: 600; font-size: 4.1rem; line-height: 1.04; letter-spacing: -.028em; text-wrap: balance; }
  p { margin: 22px 0 0; font-size: 1.3rem; line-height: 1.45; color: rgba(255,255,255,.84); max-width: 30ch; }
  .plate { position: absolute; right: 64px; top: 72px; width: 430px; height: 486px; border-radius: 20px; background: #fff; overflow: hidden;
           box-shadow: 0 34px 70px -28px rgba(3,16,32,.75); display: grid; place-items: center; }
  .plate img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<div class="card">
  <div class="bg"><img src="../site/assets/img/news/factory.webp" alt=""></div>
  <div class="copy">
    <div class="mark">
      <span class="mono">PM</span>
      <span><div class="name">Perangkap Minyak</div><div class="tag">Kualiti Alam Hijau (M) Sdn Bhd</div></span>
    </div>
    <div class="eyebrow"><i></i>SIRIM certified &middot; Since 1996</div>
    <h1>Grease traps, made in Malaysia</h1>
    <p>Undersink, centralized and oil interceptor models, auto dosing and bio-enzyme.</p>
  </div>
  <div class="plate"><img src="../site/assets/img/products/gta335-1.webp" alt=""></div>
</div>
</body>
</html>
